name: AerialDet CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ────────────────────────────
  backend:
    name: Backend · Lint & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic Pillow numpy
          # torch/torchvision not installed in CI (too large) — syntax only

      - name: Syntax check
        working-directory: backend
        run: |
          python -m py_compile app.py
          python -m py_compile models/hybrid_model.py
          python -m py_compile train.py
          python -m py_compile inference.py
          echo "✓ All backend files pass syntax check"

  # ── Frontend build ───────────────────────────
  frontend:
    name: Frontend · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Docker build (optional) ──────────────────
  docker:
    name: Docker · Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t aerialdet-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t aerialdet-frontend:${{ github.sha }} ./frontend
