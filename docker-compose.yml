version: "3.9"

services:
  backend:
    build: ./backend
    container_name: aerialdet-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/checkpoints:/app/checkpoints
      - ./backend/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aerialdet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
